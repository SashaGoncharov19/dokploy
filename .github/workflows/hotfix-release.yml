name: Hotfix Release

# Upstream-only: upstream's hotfix process, needs HOTFIX_PUSH_TOKEN.
# The required secrets exist in Dokploy/dokploy and not in this fork, so every job
# is gated on the repository rather than the file being deleted - deleting it would
# conflict on every upstream merge. See docs/FORK-STRATEGY.md.

on:
  workflow_dispatch:

concurrency:
  group: hotfix-to-main
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Dokploy/dokploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.HOTFIX_PUSH_TOKEN }}

      - name: Bump patch version and push
        run: |
          git config user.name "Dokploy Bot"
          git config user.email "bot@dokploy.com"
          CURRENT=$(node -p "require('./apps/dokploy/package.json').version")
          NEW=$(echo "$CURRENT" | awk -F. -v OFS=. '{$NF++; print}')
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW\"/" apps/dokploy/package.json
          git commit -am "chore: release ${NEW}"
          git push origin main
