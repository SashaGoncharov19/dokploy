name: Publish images

# Builds and publishes this fork's images to its own GitHub Container Registry.
#
# Upstream's dokploy.yml and deploy.yml push to Docker Hub under dokploy/* with
# secrets this fork does not have; both are gated to the upstream repository.
# GHCR authenticates with the built-in GITHUB_TOKEN, so there is nothing to set up.
#
# amd64 and arm64 are built on native runners rather than under QEMU: the web
# image runs a full `next build`, and emulating that is slow enough to time out.
# arm64 matters here - a Raspberry Pi 5 is arm64, as are Ampere/Graviton VPSes.

on:
  push:
    branches: [main, canary]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - { dockerfile: Dockerfile, suffix: "" }
          - { dockerfile: Dockerfile.server, suffix: "-api" }
          - { dockerfile: Dockerfile.schedule, suffix: "-schedules" }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image and tag
        id: meta
        run: |
          # GHCR requires a lowercase image path
          image="$(echo "${REGISTRY}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')${{ matrix.image.suffix }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then tag="latest"; else tag="canary"; fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push (${{ matrix.platform.arch }})
        id: push
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ matrix.platform.arch }}
          cache-from: type=gha,scope=${{ matrix.image.suffix }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.suffix }}-${{ matrix.platform.arch }}

      # Six of these jobs push to GHCR at once, and GHCR answers a burst with a
      # secondary rate limit - "denied: permission_denied" wearing a 403, which
      # reads like a credentials problem and is not. It killed the publish for
      # canary twice (runs 32151479013 and 32152177649), leaving the tag stale.
      #
      # The layers are already built and cached by this point, so a retry is
      # cheap: it re-pushes rather than rebuilding.
      - name: Back off before retrying
        if: steps.push.outcome == 'failure'
        run: sleep $(( (RANDOM % 60) + 60 ))

      - name: Wait out the rate limit and retry the push
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ matrix.platform.arch }}
          cache-from: type=gha,scope=${{ matrix.image.suffix }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.suffix }}-${{ matrix.platform.arch }}

  manifest:
    # Combines the per-arch tags into one multi-arch tag, so `docker pull` picks
    # the right architecture automatically.
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      # Serialised deliberately: these create six tags between them and take
      # seconds each, so running them at once only adds to the GHCR burst that
      # the retry above exists to survive.
      max-parallel: 1
      matrix:
        suffix: ["", "-api", "-schedules"]
    steps:
      # Needed only so the version-tag step below can read package.json.
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          image="$(echo "${REGISTRY}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')${{ matrix.suffix }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then tag="latest"; else tag="canary"; fi
          # Same secondary rate limit as the build push; retry rather than
          # leaving a half-published set of tags behind.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "attempt $attempt failed, backing off" >&2
              sleep $(( attempt * 30 ))
            done
            return 1
          }

          retry docker buildx imagetools create -t "${image}:${tag}" \
            "${image}:${tag}-amd64" \
            "${image}:${tag}-arm64"
          retry docker buildx imagetools create -t "${image}:${{ github.sha }}" \
            "${image}:${tag}-amd64" \
            "${image}:${tag}-arm64"
          echo "Published ${image}:${tag} (amd64 + arm64)"

          # The in-app update check only ever reports a version number when the
          # running image is `latest` AND the registry holds a `v*` tag on the
          # same digest - see getUpdateData in packages/server/src/services/
          # settings.ts. Without this step it falls back to showing no version
          # at all, which is why the panel used to read "canary".
          if [ "$tag" = "latest" ]; then
            version="$(grep -m1 '"version"' apps/dokploy/package.json | cut -d'"' -f4)"
            if [ -z "$version" ]; then
              echo "Could not read version from apps/dokploy/package.json" >&2
              exit 1
            fi
            case "$version" in
              v*) ;;
              *) version="v${version}" ;;
            esac
            retry docker buildx imagetools create -t "${image}:${version}" \
              "${image}:${tag}-amd64" \
              "${image}:${tag}-arm64"
            echo "Published ${image}:${version} (amd64 + arm64)"
          fi
